# ==============================================================================
# Hostinger VPS KVM 2 Nginx Production Reverse Proxy Configuration
# Place in: /etc/nginx/sites-available/apexbuild.conf
# Symlink: ln -s /etc/nginx/sites-available/apexbuild.conf /etc/nginx/sites-enabled/
# ==============================================================================

# Redirect HTTP to HTTPS (Required for Web Push & FCM Service Worker)
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    return 301 https://$host$request_uri;
}

# Production HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # SSL Certificates (Generated via Certbot: certbot --nginx -d yourdomain.com)
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Frontend Single Page Application (Static React Build)
    root /var/www/apexbuild-platform/frontend/dist;
    index index.html;

    # Gzip Compression for Fast Assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    # Service Worker & PWA files: No-cache and Service-Worker-Allowed header
    location ~* (sw\.js|firebase-messaging-sw\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        expires 0;
        try_files $uri =404;
    }

    # Static Assets (Cache for 1 year with content hashes)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Backend API Reverse Proxy (Forwarding to PM2 cluster on port 5000)
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # SPA Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
